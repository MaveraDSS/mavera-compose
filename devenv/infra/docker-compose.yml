# Local infrastructure for services that run on the developer machine (DSS-5585).
# Started by `devenv up` as compose project "mavera-devenv"; nothing here talks to any cluster.
#
#   rabbitmq  amqp://mavera:mavera@localhost:5672   management UI http://localhost:15672
#   redis     localhost:6379
#   jaeger    OTLP gRPC localhost:4317, OTLP HTTP localhost:4318, UI http://localhost:16686
#
# The images match the fleet compose file at the repo root (rabbitmq:3.13-management, redis:7-alpine).
# A local service must always be pointed here, never at the cluster broker: document/evaluation/user
# services start named consumers on connect and would steal real messages.

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: mavera
      RABBITMQ_DEFAULT_PASS: mavera
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Jaeger all-in-one accepts OTLP directly, so no separate collector is needed locally.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # --db local (compose profile "db"): SQL Server restored from the dev02 backups
  # that mavera-compose ships (Databases.zip, 2024), using the same restore and
  # init scripts as the fleet compose file at the repo root. x64 image: on an
  # arm64 Mac it runs emulated (Rosetta in Docker Desktop / Colima); give the VM
  # at least 4 GB. SA password is a fixed dev value, this database holds only
  # the restored dev02 copy.
  # ---------------------------------------------------------------------------
  sqlserver:
    profiles: ["db"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Mavera_L0cal_Dev
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - mssql-backups:/var/opt/mssql/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s

  mssql-backups-init:
    profiles: ["db"]
    image: alpine:3
    restart: "no"
    volumes:
      - ../../Databases.zip:/src/Databases.zip:ro
      - mssql-backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        stamp=$$(md5sum /src/Databases.zip | cut -d' ' -f1)
        if [ -f /backups/.stamp ] && [ "$$(cat /backups/.stamp)" = "$$stamp" ]; then
          echo "backups already extracted ($$stamp)"; exit 0
        fi
        echo "extracting Databases.zip ($$stamp)"
        rm -f /backups/*.bak /backups/.stamp
        unzip -o -j /src/Databases.zip '*.bak' -d /backups
        echo "$$stamp" > /backups/.stamp
        ls -la /backups/*.bak

  mssql-init:
    profiles: ["db"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    user: root
    restart: "no"
    depends_on:
      sqlserver: { condition: service_healthy }
      mssql-backups-init: { condition: service_completed_successfully }
    environment:
      DB_PASS: Mavera_L0cal_Dev
      SQL_SERVER: sqlserver
      SQL_RESTORE_FORCE: "false"
    volumes:
      - ../../config/mssql-init:/init:ro
      - ../../config/mssql-restore.sh:/mssql-restore.sh:ro
      - mssql-backups:/var/opt/mssql/backups:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        /bin/sh /mssql-restore.sh
        for f in /init/*.sql; do
          echo "applying $$f"
          /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$DB_PASS" -b -i "$$f"
        done
        echo "mssql-init complete"

volumes:
  rabbitmq-data:
  redis-data:
  sqlserver-data:
  mssql-backups:
