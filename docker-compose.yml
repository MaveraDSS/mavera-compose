# =============================================================================
# Mavera backend fleet — single Dokploy Compose app
#
#   docker compose up -d                        # infrastructure only
#   docker compose --profile platform up -d     # + core platform services
#   docker compose --profile all up -d          # + all 29 services
#
# HOW CONFIGURATION WORKS
#   Every appsettings.json in these repos is an envsubst template whose values
#   are flat $Placeholder tokens. The Kubernetes deployments render them in an
#   initContainer (`envsubst < /app/appsettings.json > /data/appsettings.json`),
#   which is why all 29 runtime images install gettext.
#
#   This file does the same thing: it supplies that same flat variable set via
#   `x-placeholders` and renders the file in `config/entrypoint.sh` before
#   starting the app. There are therefore no Section__Key overrides at all.
#
#   Service-to-service URLs are already templated as
#     http://$ServiceSettings_Services_UserService.svc.cluster.local/Vera/UserService
#   so each service declares a network alias `<name>.svc.cluster.local` and the
#   in-cluster URLs resolve unchanged. `rabbitmq.rabbitmq.svc.cluster.local` is
#   hard-coded in 24 repos, so the broker carries that alias too.
#
# WHICH BRANCH IS BUILT
#   All build contexts resolve `#${BRANCH:-develop}` except three repos that
#   have not cut the current release branch — mavera-identity-server,
#   mavera-news-manager and mavera-audit — which use `${BRANCH_FALLBACK:-develop}`.
#   Re-check membership before bumping BRANCH; when a repo catches up, move its
#   context back onto ${BRANCH}. To list the repos that still need the fallback:
#
#     REL='release%2Fv.be-2026-04-01'
#     for r in $(grep -oE 'MaveraDSS/[a-z0-9-]+' docker-compose.yml | sort -u); do
#       gh api "repos/$r/branches/$REL" >/dev/null 2>&1 || echo "fallback: $r"
#     done
#
# DOKPLOY
#   Compose Type must be "Docker Compose", not "Stack" — Swarm does not
#   support `build`. See README.md.
# =============================================================================

name: mavera

# -----------------------------------------------------------------------------
# The complete placeholder set. envsubst blanks any variable it cannot resolve,
# so every token appearing in any of the 29 appsettings.json files is listed
# here — 169 in total.
# -----------------------------------------------------------------------------
x-placeholders: &placeholders
  ASPNETCORE_ENVIRONMENT: Production          # matches the k8s overlays; no appsettings.Production.json exists in any repo
  ASPNETCORE_HTTP_PORTS: "80"

  # --- logging & tracing ---
  Log_Level: ${LOG_LEVEL:-Information}
  Log_IncludeScopes: "false"
  SeriLog_Level: ${LOG_LEVEL:-Information}
  Tracing_Connection_String: http://otel-collector:4317   # MUST be an absolute URI: ~10 services throw on an invalid one
  ServiceSettings_ENV: ${ENV_NAME:-dokploy}
  # Bare host on purpose: the appsettings templates prefix it themselves
  # (user-service reads "disco": "https://$ServiceSettings_EnvURL").
  ServiceSettings_EnvURL: ${GATEWAY_HOST:?GATEWAY_HOST is not set}
  ServiceSettings_ClientUrl: ${PUBLIC_SCHEME:-http}://${GATEWAY_HOST:?GATEWAY_HOST is not set}

  # --- SQL Server: one server, seven catalogs ---
  ConnectionStrings_DB_Server: ${DB_SERVER:-sqlserver}
  ConnectionStrings_DB_User: ${DB_USER:-sa}
  ConnectionStrings_DB_Pass: ${DB_PASS:?DB_PASS is not set}
  ConnectionStrings_DB_Name: vera-dev02                  # restored manually; see README
  ConnectionStrings_DB_InboxOutbox: MaveraInboxOutbox
  ConnectionStrings_CaregiverContext_DB_Name: vera-caregivers-dev02   # restored manually
  ConnectionStrings_SchedulerContext_DB_Name: MaveraScheduler
  ConnectionString_DB_IdentityServer: vera-identity-dev02  # restored manually
  ConnectionStrings_DB_Storage_Operations: MaveraStorageOperations
  ConnectionStrings_DB_Ocr_Operations: MaveraOcrOperations

  # --- MongoDB: one server, eleven databases ---
  ConnectionStrings_DB_Mongo_Server: mongo
  ConnectionStrings_DB_Mongo_User: ${MONGO_USER:-mavera}
  ConnectionStrings_DB_Mongo_Pass: ${MONGO_PASS:?MONGO_PASS is not set}
  ConnectionStrings_DB_Mongo_AuditLoger: audit-logs
  ConnectionStrings_DB_Mongo_EvaluationService: evaluation-service
  ConnectionStrings_DB_Mongo_DocumentProcessor: document-processor
  ConnectionStrings_DB_Mongo_DocumentClassifier: document-classifier
  ConnectionStrings_DB_Mongo_DocumentSummaries: document-summaries
  ConnectionStrings_DB_Mongo_DocumentAnonymize: document-anonymize
  ConnectionStrings_DB_Mongo_RelevanceScore: relevance-score
  ConnectionStrings_DB_Mongo_JournalEventsClassifier: journalevents-classifier
  ConnectionStrings_DB_Mongo_IdentityCheck: identity-check
  ConnectionStrings_DB_Mongo_Fkassan: fkassan
  ConnectionStrings_DB_Mongo_EnhancedPatientView: enhanced-patient-view

  # --- RabbitMQ (host is hard-coded in the templates; see the alias on the broker) ---
  # One broker, one vhost per project. `rabbitmq-init` creates the vhosts listed
  # in RABBITMQ_VHOSTS; RABBITMQ_VHOST picks the one these services use. The
  # broker does not create a vhost on connect, so an unlisted name means
  # ACCESS_REFUSED, not an empty namespace.
  MessageBroker_Username: ${RABBITMQ_USER:-mavera}
  MessageBroker_Password: ${RABBITMQ_PASS:?RABBITMQ_PASS is not set}
  MessageBroker_VirtualHost: ${RABBITMQ_VHOST:-/}

  # --- Redis ---
  RedisInstance: redis
  RedisPort: "6379"
  CacheType: ${CACHE_TYPE:-redis}             # redis | inmemory

  # --- Object storage (MinIO, S3-compatible) ---
  BucketProviderUrl: http://minio:9000
  BucketProviderKey: ${MINIO_USER:-mavera}
  BucketProviderSecret: ${MINIO_PASS:?MINIO_PASS is not set}
  BucketName: ${BUCKET_ASSETS:-mavera-assets}
  Bucket_DocumentsBucketName: ${BUCKET_DOCUMENTS:-mavera-documents}
  Bucket_Region: ${BUCKET_REGION:-us-east-1}
  Bucket_CaseDocuments_Folder: case-documents
  Bucket_UserProfilePictures_Folder: user-profile-pictures
  Bucket_UserDocuments_Folder: user-documents
  Bucket_VeraInsuranceDocuments_Folder: insurance-documents
  Bucket_LookupTables_Folder: lookup-tables
  assets_wysiwyg_folder: wysiwyg

  # --- Service discovery: placeholder -> container name ---
  # The ".svc.cluster.local" suffix in the templates is satisfied by each
  # service's network alias, so these URLs work verbatim.
  ServiceSettings_Services_Audit: mavera-audit
  ServiceSettings_Services_Caregivers: mavera-caregivers
  ServiceSettings_Services_Client_Relevance_Score: mavera-ai-client-relevance-score
  ServiceSettings_Services_Dashboard: mavera-dashboard
  ServiceSettings_Services_DocumentClassifier: mavera-ai-document-classifier
  ServiceSettings_Services_DocumentManagement: mavera-document-service
  ServiceSettings_Services_DocumentProcessor: mavera-ai-document-processor
  ServiceSettings_Services_DocumentSummaries: mavera-ai-document-summaries
  ServiceSettings_Services_EnhancedPatientView: mavera-enhanced-patient-view
  ServiceSettings_Services_EvaluationService: mavera-evaluation-service
  ServiceSettings_Services_FileConversion: mavera-file-conversion-service
  ServiceSettings_Services_Fkassan: mavera-fkassan-service
  ServiceSettings_Services_IdentityCheck: mavera-ai-identitycheck-processor
  ServiceSettings_Services_IdentityClient: mavera-identity-client
  ServiceSettings_Services_IdentityService: mavera-identity-server
  ServiceSettings_Services_JournalEventsClassifier: mavera-ai-journalevents-classifier
  ServiceSettings_Services_Kuralink: mavera-kuralink
  ServiceSettings_Services_MedicalAdvisorsNetwork: mavera-medical-advisor-network
  ServiceSettings_Services_NewsManager: mavera-news-manager
  ServiceSettings_Services_OcrService: mavera-ocr
  ServiceSettings_Services_PdfGenerator: mavera-pdf-generator-service
  ServiceSettings_Services_StorageService: mavera-storage-service
  ServiceSettings_Services_Timeline: mavera-ai-timeline
  ServiceSettings_Services_UserService: mavera-user-service
  # Out of scope for these 29 repos — no container exists. Left as a
  # non-resolving name so the URLs stay syntactically valid.
  ServiceSettings_Services_Translation: mavera-translation-service
  ServiceSettings_Services_EventPredict: not-configured
  # Bare host on purpose: libertine's YARP cluster addresses this one as
  # http://$VAR/ with no ".svc.cluster.local" suffix. It is a Python GPU
  # inference service (mavera-ai-idp2-inference), outside these 29 repos.
  ServiceSettings_Services_Idp2: ${AI_IDP2_HOST:-not-configured}

  # --- IdentityServer ---
  IdentityServer_ApplicationName: Mavera
  # These two are advertised in the OIDC discovery document and become the
  # `iss` claim in every token. TLS terminates at Traefik, so when you put a
  # real domain behind HTTPS you MUST set PUBLIC_SCHEME=https or clients see
  # an issuer that does not match the URL they actually reached.
  IdentityServer_IssuerUri: ${PUBLIC_SCHEME:-http}://${IDENTITY_HOST:?IDENTITY_HOST is not set}
  IdentityServer_PublicOrigin: ${PUBLIC_SCHEME:-http}://${IDENTITY_HOST:?IDENTITY_HOST is not set}
  IdentityServer_LoginUrl: /account/login
  IdentityServer_LogoutUrl: /account/logout
  IdentityServer_ErrorUrl: /home/error
  IdentityServer_UnauthorizedUrl: /home/unauthorized
  IdentityServer_PostLogoutRedirectUri: ${PUBLIC_SCHEME:-http}://${GATEWAY_HOST:?GATEWAY_HOST is not set}
  IdentityServer_SecretKey: ${IDENTITY_SECRET_KEY:-}
  IdentityServer_MembershipHash: ${IDENTITY_MEMBERSHIP_HASH:-}
  # user-service reads this as a whole URL ("IdentityClient": { "BaseUrl": ... }),
  # not a host fragment, so it carries the scheme itself.
  IdentityClient_BaseUrl: http://mavera-identity-client.svc.cluster.local

  # --- Gotenberg (PDF conversion engine used by file-conversion-service) ---
  GotenbergSharpClient_ServiceUrl: gotenberg:3000

  # --- AI model endpoints: separate Python services, outside these 29 repos ---
  # Whole-URL placeholders get a syntactically valid but non-resolving URI;
  # host-fragment placeholders get a bare name.
  AiModels_DocumentProcessorUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorNorwayUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorDenmarkUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorFinlandUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorGermanyUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorNetherlandsUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorPortugalUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentProcessorUKUrl: ${AI_DOCUMENT_PROCESSOR_URL:-http://not-configured.invalid}
  AiModels_DocumentClassificationUrl: ${AI_DOCUMENT_CLASSIFICATION_URL:-http://not-configured.invalid}
  AiModels_DocumentSummariesUrl: ${AI_SUMMARIES_URL:-http://not-configured.invalid}
  AiModels_FkassanUrl: ${AI_FKASSAN_URL:-http://not-configured.invalid}
  AiModels_OcrModelUrl: ${AI_OCR_URL:-http://not-configured.invalid}
  AiModels_RelevanceScore_Norway: ${AI_RELEVANCE_URL:-http://not-configured.invalid}
  AiModels_RelevanceScore_Denmark: ${AI_RELEVANCE_URL:-http://not-configured.invalid}
  AiModels_RelevanceScore_Finland: ${AI_RELEVANCE_URL:-http://not-configured.invalid}
  AiModels_EventPredict_Norway: ${AI_EVENT_PREDICT_URL:-http://not-configured.invalid}
  AiModels_EventPredict_Denmark: ${AI_EVENT_PREDICT_URL:-http://not-configured.invalid}
  AiModels_EventPredict_Finland: ${AI_EVENT_PREDICT_URL:-http://not-configured.invalid}
  AiModels_RelevanceScoreUrl: not-configured        # host fragment: http://$VAR.svc.cluster.local:5000/...
  AiModels_DocumentAnonymizeUrl: not-configured     # host fragment
  Idp_LatestIdpMarkets: ${IDP_MARKETS:-Sweden}
  Idp_Document_Timeout: "300"
  Idp_Parallel_Documents: "2"
  llmSummaries_ConcurrentEvaluations: "1"
  ThreadingSettings_NumberOfConcurrentTasks_JournalEventsClassifier: "2"

  # --- tuning / limits (safe defaults; tune per environment) ---
  DefaultDaysUntilPasswordExpired: "90"
  DefaultMaxLengthEvaluationAttribute: "4000"
  DocumentDeletionBatchSize: "100"
  MaxTextCharacterCount: "1000000"
  MaxLengthExpertOpinion: "20000"
  MaxCharCountExplanationMedicalTerminology: "2000"
  MaximumPasswordCount: "5"
  PasswordRequestEmailExpiryHours: "24"
  UserLockoutDurationInMinutes: "15"
  WrongPasswordAttemptsUntilLockout: "5"
  MaveraNetworkId: "1"
  OcrService_MaxOcrDocumentsPerBatch: "5"
  Ocr_Document_Timeout: "600"
  Ocr_Engine_Iris: "true"
  Ocr_Max_Page_Height: "4000"
  Ocr_Max_Page_Width: "4000"
  StorageService_MaxEvaluationDeletionPerBatch: "50"
  StorageService_MaxDocumentAttachedObjectDeletionPerBatch: "50"

  # --- secrets: intentionally blank. Flows depending on these will not work. ---
  Okta_Domain: ${OKTA_DOMAIN:-}
  Okta_AuthServerId: ${OKTA_AUTH_SERVER_ID:-}
  Okta_Audience: ${OKTA_AUDIENCE:-api}
  Okta_Audiences: ${OKTA_AUDIENCES:-api}
  Okta_Groups: ${OKTA_GROUPS:-}
  Okta_EventHookSecret: ${OKTA_EVENT_HOOK_SECRET:-}
  Okta_InternalServices_ClientId: ${OKTA_INTERNAL_CLIENT_ID:-}
  Okta_InternalServices_Secret: ${OKTA_INTERNAL_SECRET:-}
  Okta_ProvisioningBaseUrl: ${OKTA_PROVISIONING_BASE_URL:-}
  Okta_ProvisioningClientId: ${OKTA_PROVISIONING_CLIENT_ID:-}
  Okta_ProvisioningPrivateKey: ${OKTA_PROVISIONING_PRIVATE_KEY:-}
  Okta_ProvisioningPublicKeyId: ${OKTA_PROVISIONING_PUBLIC_KEY_ID:-}
  InternalServices_Authority: http://mavera-identity-server
  InternalServices_Audience: internalapi
  InternalServicesSettings_Secret: ${INTERNAL_SERVICES_SECRET:-}
  InternalServicesSettings_SystemAccountUserId: ${SYSTEM_ACCOUNT_USER_ID:-}
  CryptoSettings_CryptoIV: ${CRYPTO_IV:-}
  CryptoSettings_CryptoKey: ${CRYPTO_KEY:-}
  ContractSettings_CallbackUrl: ${PUBLIC_SCHEME:-http}://${GATEWAY_HOST:?GATEWAY_HOST is not set}/contract/callback
  MailSettings_ApiKey: ${MAIL_API_KEY:-}
  MailSettings_ApiKeyId: ${MAIL_API_KEY_ID:-}
  MailSettings_BccMonitoringEnabled: "false"
  MailSettings_MailEnvironment: ${ENV_NAME:-dokploy}
  MailSettings_TestingEmailAddress: ${MAIL_TEST_ADDRESS:-}
  SmsSettings_UserName: ${SMS_USERNAME:-}
  SmsSettings_Password: ${SMS_PASSWORD:-}
  SmbSettings_Server: ${SMB_SERVER:-}
  SmbSettings_Share: ${SMB_SHARE:-}
  SmbSettings_UserName: ${SMB_USERNAME:-}
  SmbSettings_Password: ${SMB_PASSWORD:-}
  Kuralink_ApiRoot: ${KURALINK_API_ROOT:-http://not-configured.invalid}
  Kuralink_ServiceProviderApiKey: ${KURALINK_API_KEY:-}
  MicrosoftTeamsWebhook_Kuralink: ${TEAMS_WEBHOOK:-}
  MicrosoftTeamsWebhook_Kuralink_Notification_Enabled: "false"
  Ver_PDFTRON_SERVER_SDK_LICENSE_KEY: ${APRYSE_LICENSE_KEY:-}
  Ver_PDFTRON_SERVER_SDK_LICENSE_KEY_FOR_OCR: ${APRYSE_LICENSE_KEY_OCR:-}

# -----------------------------------------------------------------------------
# Shared service scaffolding
# -----------------------------------------------------------------------------
x-service-base: &service-base
  restart: unless-stopped
  # Each service declares both `image:` and `build:`. With no pull_policy,
  # Compose would try to PULL from ACR first and only build after that fails —
  # which means a doomed, unauthenticated registry round-trip on every deploy.
  # `build` forces the local build and skips the pull entirely; the `image:`
  # value is then just the name/tag applied to the image built on this host.
  #
  # To switch to pull-only later (once ci-template pushes a moving tag), change
  # this to `always` and delete the `build:` blocks. See README.
  pull_policy: build
  entrypoint: ["/bin/sh", "/entrypoint.sh"]
  volumes:
    - ./config/entrypoint.sh:/entrypoint.sh:ro

# Dependency fragments, merged per service.
x-dep-otel: &dep-otel
  otel-collector: { condition: service_started }
x-dep-sql: &dep-sql
  mssql-init: { condition: service_completed_successfully }
x-dep-mongo: &dep-mongo
  mongo-init: { condition: service_completed_successfully }
x-dep-minio: &dep-minio
  minio-init: { condition: service_completed_successfully }
x-dep-rabbit: &dep-rabbit
  # Waits on the init, not the broker: a service that connects before its vhost
  # exists gets ACCESS_REFUSED, and rabbitmq-init already waits for health.
  rabbitmq-init: { condition: service_completed_successfully }
x-dep-redis: &dep-redis
  redis: { condition: service_healthy }

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 5
  # Generous: on a VM booting many services at once, .NET cold start plus
  # first-request JIT can easily exceed a 90s window.
  start_period: 120s

services:

  # ===========================================================================
  # INFRASTRUCTURE — always starts (no profile)
  # ===========================================================================

  sqlserver:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    restart: unless-stopped
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASS:?DB_PASS is not set}
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
      # SQL Server on Linux otherwise grows to ~80% of host RAM, which starves
      # the 29 service containers on a shared VM. Tune for your instance size.
      # NOTE: this variable is only honoured during first-run setup (it is
      # written into mssql.conf then). mssql-init therefore also applies it via
      # sp_configure, so the cap holds on an already-initialised volume too.
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - sqlserver-data:/var/opt/mssql
      # RESTORE runs inside the server process, so the .bak files must be on
      # the server's own filesystem. mssql-init mounts the same volume at the
      # same path -- it enumerates the files, the server opens them, and the
      # paths it puts in the RESTORE statement have to be valid for both.
      - mssql-backups:/var/opt/mssql/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [mavera]

  # Unpacks Databases.zip into the shared backup volume so `sqlserver` can
  # RESTORE from it. Committing the zip rather than the three .bak files keeps
  # the repo under GitHub's 100 MB per-file limit (the two large backups are
  # ~145 MB each uncompressed) and matches .gitignore, which excludes *.bak.
  #
  # Alpine is used for its busybox `unzip`; the SQL Server image has none.
  # Re-extracts only when the zip changes, so redeploys cost one checksum.
  mssql-backups-init:
    image: alpine:3
    restart: "no"
    volumes:
      - ./Databases.zip:/src/Databases.zip:ro
      - mssql-backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Absent (or a directory, which is what Compose creates for a missing
        # bind-mount source) means "no backups supplied" -- deploy anyway, and
        # let 00-init-databases.sql report the databases as [MISSING].
        if [ ! -f /src/Databases.zip ]; then
          echo "no Databases.zip in the project directory - nothing to extract"
          exit 0
        fi
        stamp=$$(md5sum /src/Databases.zip | cut -d' ' -f1)
        if [ -f /backups/.stamp ] && [ "$$(cat /backups/.stamp)" = "$$stamp" ]; then
          echo "backups already extracted ($$stamp)"
          ls -la /backups/*.bak 2>/dev/null || true
          exit 0
        fi
        echo "extracting Databases.zip ($$stamp)"
        rm -f /backups/*.bak /backups/.stamp
        unzip -o -j /src/Databases.zip '*.bak' -d /backups
        echo "$$stamp" > /backups/.stamp
        ls -la /backups/*.bak
    networks: [mavera]

  # Restores the data-bearing databases, then creates the empty catalogs.
  # NOTE: the catalogs it creates are EMPTY —
  # see README "SQL schema is not solved by compose".
  # Reuses the server image: it already ships /opt/mssql-tools18/bin/sqlcmd, so
  # there is no second image to pull and the client version always matches the
  # server. (There is no mcr.microsoft.com/mssql-tools18 repository; the only
  # standalone tools image is mssql-tools:latest, which is sqlcmd 17.)
  mssql-init:
    image: ${SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    user: root
    restart: "no"
    depends_on:
      sqlserver: { condition: service_healthy }
      mssql-backups-init: { condition: service_completed_successfully }
    environment:
      DB_PASS: ${DB_PASS:?DB_PASS is not set}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      SQL_RESTORE_ENABLED: ${SQL_RESTORE_ENABLED:-true}
      # DESTRUCTIVE: true re-restores over the live databases on every deploy.
      SQL_RESTORE_FORCE: ${SQL_RESTORE_FORCE:-false}
    volumes:
      - ./config/mssql-init:/init:ro
      - ./config/mssql-restore.sh:/mssql-restore.sh:ro
      # Same path as in `sqlserver`, deliberately: mssql-restore.sh globs this
      # directory for <db>*.bak and puts the paths it finds straight into the
      # RESTORE statement the server executes.
      - mssql-backups:/var/opt/mssql/backups:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        # Enforce the memory cap regardless of when the volume was initialised.
        if [ -n "$$MSSQL_MEMORY_LIMIT_MB" ]; then
          echo "capping max server memory at $$MSSQL_MEMORY_LIMIT_MB MB"
          $$SQLCMD -C -S sqlserver -U sa -P "$$DB_PASS" -b -Q "
            EXEC sp_configure 'show advanced options', 1; RECONFIGURE;
            EXEC sp_configure 'max server memory (MB)', $$MSSQL_MEMORY_LIMIT_MB; RECONFIGURE;"
        fi
        # Restore first: 00-init-databases.sql then reports the data-bearing
        # databases as [present] rather than [MISSING], so one log confirms both.
        /bin/sh /mssql-restore.sh
        for f in /init/*.sql; do
          echo "applying $$f"
          /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$DB_PASS" -b -i "$$f"
        done
        echo "mssql-init complete"
    networks: [mavera]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [mavera]

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mavera}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is not set}
      # The admin's own vhost, and the fallback for anything that does not set
      # RABBITMQ_VHOST. Per-project vhosts come from rabbitmq-init:
      # RABBITMQ_DEFAULT_VHOST only ever makes one, on the very first boot.
      RABBITMQ_DEFAULT_VHOST: "/"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      mavera:
        aliases:
          # Hard-coded (not a placeholder) in 24 of the 29 appsettings.json files.
          - rabbitmq.rabbitmq.svc.cluster.local

  # One vhost per project, so a project's services share a message namespace
  # with each other and with nobody else. Optionally a per-vhost user too, which
  # turns that boundary from a convention into something the broker enforces.
  # Driven by RABBITMQ_VHOSTS; see config/rabbitmq-init.sh for the entry format.
  #
  # curl, not the rabbitmq image: rabbitmqctl would need the broker's Erlang
  # cookie and a pinned node name. The script explains why that is a trap.
  rabbitmq-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-mavera}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is not set}
      RABBITMQ_VHOSTS: ${RABBITMQ_VHOSTS:-}
    volumes:
      - ./config/rabbitmq-init.sh:/rabbitmq-init.sh:ro
    entrypoint: ["/bin/sh", "/rabbitmq-init.sh"]
    networks: [mavera]

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is not set}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [mavera]

  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGO_APP_USER: ${MONGO_USER:-mavera}
      MONGO_APP_PASS: ${MONGO_PASS:?MONGO_PASS is not set}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASS: ${MONGO_ROOT_PASS:?MONGO_ROOT_PASS is not set}
    volumes:
      - ./config/mongo-init.js:/init/mongo-init.js:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mongosh "mongodb://$$MONGO_ROOT_USER:$$MONGO_ROOT_PASS@mongo:27017/admin" \
          --quiet /init/mongo-init.js || echo "mongo-init: users may already exist, continuing"
        echo "mongo-init complete"
    networks: [mavera]

  minio:
    # MinIO deleted its Docker Hub repositories: `minio/minio` and `minio/mc`
    # now 404, which is why a deploy fails with "pull access denied ...
    # repository does not exist". The images live on quay.io.
    #
    # Pinned, not `:latest`, for two reasons: `latest` is exactly what vanished,
    # and RELEASE.2025-05-24T17-08-30Z onwards strips the management UI out of
    # the console, leaving an object browser. This is the last release with the
    # full console that README documents on port 9001. Read the release notes
    # before bumping it.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mavera}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?MINIO_PASS is not set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [mavera]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mavera}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?MINIO_PASS is not set}
      BUCKET_ASSETS: ${BUCKET_ASSETS:-mavera-assets}
      BUCKET_DOCUMENTS: ${BUCKET_DOCUMENTS:-mavera-documents}
    volumes:
      - ./config/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    networks: [mavera]

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Current Seq images refuse to start on first run without one of these.
      # A password is used rather than SEQ_FIRSTRUN_NOAUTHENTICATION because Seq
      # can be given a public Dokploy domain, and that would expose every log.
      # Ingestion stays anonymous (Seq does not require API keys by default),
      # so the collector needs no credentials.
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASS:?SEQ_ADMIN_PASS is not set}
    volumes:
      - seq-data:/data
    networks: [mavera]

  # Terminates the services' OTLP/gRPC stream and forwards to Seq.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - seq
    networks: [mavera]

