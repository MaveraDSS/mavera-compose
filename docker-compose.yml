networks:
  mavera:
    driver: bridge
  # Dokploy's Traefik network. Only the two publicly-routed services join it.
  # Remove this block and the `dokploy-network:` entries when running outside
  # Dokploy (e.g. plain `docker compose` locally).
  dokploy-network:
    external: true

volumes:
  sqlserver-data:
  # Extracted .bak files. ~300 MB, kept after restore so a re-restore (or a
  # rebuilt sqlserver-data volume) does not need the zip unpacked again.
  # Reclaim with: docker volume rm mavera_mssql-backups
  mssql-backups:
  redis-data:
  rabbitmq-data:
  mongo-data:
  minio-data:
  seq-data:
