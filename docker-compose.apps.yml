# -----------------------------------------------------------------------------
# Shared service scaffolding
# -----------------------------------------------------------------------------
x-service-base: &service-base
  restart: unless-stopped
  # Each service declares both `image:` and `build:`. With no pull_policy,
  # Compose would try to PULL from ACR first and only build after that fails —
  # which means a doomed, unauthenticated registry round-trip on every deploy.
  # `build` forces the local build and skips the pull entirely; the `image:`
  # value is then just the name/tag applied to the image built on this host.
  #
  # To switch to pull-only later (once ci-template pushes a moving tag), change
  # this to `always` and delete the `build:` blocks. See README.
  pull_policy: build
  entrypoint: ["/bin/sh", "/entrypoint.sh"]
  volumes:
    - ./config/entrypoint.sh:/entrypoint.sh:ro

# Dependency fragments, merged per service.
x-dep-otel: &dep-otel
  otel-collector: { condition: service_started }
x-dep-sql: &dep-sql
  mssql-init: { condition: service_completed_successfully }
x-dep-mongo: &dep-mongo
  mongo-init: { condition: service_completed_successfully }
x-dep-minio: &dep-minio
  minio-init: { condition: service_completed_successfully }
x-dep-rabbit: &dep-rabbit
  rabbitmq: { condition: service_healthy }
x-dep-redis: &dep-redis
  redis: { condition: service_healthy }

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 5
  # Generous: on a VM booting many services at once, .NET cold start plus
  # first-request JIT can easily exceed a 90s window.
  start_period: 120s

services:

  # ===========================================================================
  # PLATFORM  (profile: platform)
  # ===========================================================================

  mavera-identity-server:
    <<: *service-base
    image: ${ACR:-mavera.azurecr.io}/mavera/${ACR_ENV:-dev}/mavera-identity-server:${TAG:-develop}
    build:
      # No release/v.be-2026-04-01 in this repo as of 2026-09-05 -- falls back.
      context: https://x-access-token:${GH_PAT}@github.com/MaveraDSS/mavera-identity-server.git#${BRANCH_FALLBACK:-develop}
      dockerfile: dockerfile/Dockerfile
    profiles: ["platform", "all"]
    environment:
      <<: *placeholders
      APP_DLL: mavera-identity-server.dll
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q --spider http://localhost/Vera/IdentityServer/api/health || exit 1"]
    networks:
      dokploy-network:
        aliases:
          - mavera-identity-server
          - mavera-identity-server.svc.cluster.local
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.mavera-identity.rule=Host(`${IDENTITY_HOST:?IDENTITY_HOST is not set}`)
      - traefik.http.routers.mavera-identity.entrypoints=web
      - traefik.http.services.mavera-identity.loadbalancer.server.port=80
      # For HTTPS, prefer adding the domain in the Dokploy UI (it manages the
      # labels and the certificate itself). If you would rather do it here,
      # uncomment these and match your Traefik certResolver name:
      # - traefik.http.routers.mavera-identity-tls.rule=Host(`${IDENTITY_HOST:?IDENTITY_HOST is not set}`)
      # - traefik.http.routers.mavera-identity-tls.entrypoints=websecure
      # - traefik.http.routers.mavera-identity-tls.tls.certresolver=letsencrypt
      # - traefik.http.services.mavera-identity.loadbalancer.server.scheme=http

  # The YARP gateway. Its ReverseProxy cluster addresses are the same
  # $ServiceSettings_Services_* placeholders, so its whole routing table wires
  # itself up from x-placeholders. This is the fleet's public entry point.
  mavera-libertine:
    <<: *service-base
    image: ${ACR:-mavera.azurecr.io}/mavera/${ACR_ENV:-dev}/mavera-libertine:${TAG:-develop}
    build:
      context: https://x-access-token:${GH_PAT}@github.com/MaveraDSS/mavera-libertine.git#${BRANCH:-develop}
      dockerfile: dockerfile/Dockerfile
    profiles: ["platform", "all"]
    environment:
      <<: *placeholders
      APP_DLL: LibertineWeb.dll
    networks:
      dokploy-network:
        aliases:
          - mavera-libertine
          - mavera-libertine.svc.cluster.local
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.mavera-gateway.rule=Host(`${GATEWAY_HOST:?GATEWAY_HOST is not set}`)
      - traefik.http.routers.mavera-gateway.entrypoints=web
      - traefik.http.services.mavera-gateway.loadbalancer.server.port=80
      # For HTTPS, prefer adding the domain in the Dokploy UI (it manages the
      # labels and the certificate itself). If you would rather do it here,
      # uncomment these and match your Traefik certResolver name:
      # - traefik.http.routers.mavera-gateway-tls.rule=Host(`${GATEWAY_HOST:?GATEWAY_HOST is not set}`)
      # - traefik.http.routers.mavera-gateway-tls.entrypoints=websecure
      # - traefik.http.routers.mavera-gateway-tls.tls.certresolver=letsencrypt
      # - traefik.http.services.mavera-gateway.loadbalancer.server.scheme=http

  mavera-identity-client:
    <<: *service-base
    image: ${ACR:-mavera.azurecr.io}/mavera/${ACR_ENV:-dev}/mavera-identity-client:${TAG:-develop}
    build:
      context: https://x-access-token:${GH_PAT}@github.com/MaveraDSS/mavera-identity-client.git#${BRANCH:-develop}
      dockerfile: dockerfile/Dockerfile
    profiles: ["platform", "all"]
